# =============================================================================
# Configuración del pipeline de análisis de incidentes de IA
# =============================================================================
# Solo necesitás editar la sección "REQUERIDO" para empezar.
# Todo lo demás tiene valores por defecto que funcionan sin cambios.
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
# REQUERIDO — Las únicas cosas que tenés que configurar
# ─────────────────────────────────────────────────────────────────────────────

data:
  # Ruta al archivo CSV con los incidentes de IA
  source_path: "data/raw/oecd_aim.csv"

  # Mapeo de columnas: qué columna de tu CSV cumple cada rol en el análisis.
  # - Lado izquierdo: rol interno del pipeline (no cambiar)
  # - Lado derecho: nombre exacto de la columna en tu CSV
  #
  # Solo text_data y event_date son estrictamente necesarios.
  # El resto se puede dejar vacío ("") si tu dataset no lo tiene.
  column_mapping:
    text_data:   "summary"      # Texto principal del incidente (requerido)
    event_date:  "date"         # Fecha del incidente (requerido)
    geo_zone:    "region"       # Región geográfica (opcional)
    tags_list:   "principles"   # Categorías o etiquetas (opcional)
    harmtype:    "harmtype"     # Tipo de daño (opcional)
    industries:  "industries"   # Industria o sector (opcional)
    harmed:      "harmed"       # Grupos afectados (opcional)
    harmlevel:   "harmlevel"    # Nivel de gravedad (opcional)

  # Columnas que contienen listas de valores (ej: '["sector1", "sector2"]').
  # Dejá vacío si ninguna columna tiene este formato.
  multilabel_columns:
    - "industries"

  # Dónde guardar el dataset procesado (se crea automáticamente)
  processed_path: "data/processed/incidents_processed.parquet"


# ─────────────────────────────────────────────────────────────────────────────
# OPCIONAL — Podés dejar estos valores como están o ajustarlos
# ─────────────────────────────────────────────────────────────────────────────

filters:
  # Rango de años a incluir en el análisis. null = sin límite.
  year_range: []
  # Regiones a incluir. Lista vacía [] = todas las regiones.
  regions: []


# ─────────────────────────────────────────────────────────────────────────────
# ANÁLISIS DE SENTIMIENTO — Desactivado por defecto
# ─────────────────────────────────────────────────────────────────────────────
# El sentimiento clasifica el texto de cada incidente como negativo alto/medio/bajo.
# Requiere tiempo de cómputo extra. Activalo solo si lo necesitás.

sentiment:
  enabled: true   # Cambiá a true para activar el análisis de sentimiento

  # Modelo a usar. Elegí uno:
  #   "openai"      → GPT-4o-mini de OpenAI (necesita API key, más preciso)
  #   "transformer" → Modelo de HuggingFace (no necesita API key, ~500 MB de descarga)
  backend: "transformer"

  # Solo necesario si backend = "openai"
  openai_model:   "gpt-4o-mini"
  openai_api_key: ""   # Pegá tu key aquí para uso local. NO subas esto a git.
                       # Alternativa más segura: exportar como variable de entorno
                       # export OPENAI_API_KEY="sk-proj-..."

  # Solo necesario si backend = "transformer"
  model_name:  "cardiffnlp/twitter-roberta-base-sentiment-latest"
  batch_size:  32

  # Umbrales de clasificación (score de negatividad entre 0 y 1)
  thresholds:
    high:   0.7   # >= 0.7 → "Alta"
    medium: 0.4   # >= 0.4 → "Media", < 0.4 → "Baja"

  evaluation:
    enabled: false   # true = comparar contra etiquetas manuales (uso avanzado)
    human_label_column: "human_label"


# ─────────────────────────────────────────────────────────────────────────────
# NLP — Procesamiento de texto
# ─────────────────────────────────────────────────────────────────────────────

nlp:
  language: "english"      # Idioma del texto ("english" o "spanish")
  min_token_length: 3      # Ignorar palabras de menos de N caracteres

  # Palabras a ignorar además de las stopwords estándar
  custom_stopwords:
    - "ai"
    - "u"
    - "system"
    - "report"
    - "new"
    - "say"
    - "use"
    - "would"

  # Normalización: reemplazar variantes de una misma palabra por su forma canónica
  normalization_map:
    deepfakes: "deepfake"
    chatbots:  "chatbot"
    warns:     "warn"
    using:     "use"
    used:      "use"

  # Palabras clave para detectar incidentes relacionados con salud mental
  mental_health_keywords:
    - "mental health"
    - "stress"
    - "anxiety"
    - "depression"
    - "psychological"


# ─────────────────────────────────────────────────────────────────────────────
# ANÁLISIS DESCRIPTIVO — Parámetros de las métricas
# ─────────────────────────────────────────────────────────────────────────────

analysis:
  # Nombres de columna internos del pipeline (generados automáticamente, no cambiar)
  columns:
    region:             "geo_zone"
    year:               "year"
    year_month:         "year_month"
    tags:               "tags_list"
    harm_type:          "harmtype"
    industries:         "industries"
    harmed:             "harmed"
    harm_level:         "harmlevel"
    sentiment_score:    "sentiment_score"
    mental_health_flag: "mental_health_flag"
    tokens:             "tokens"

  # Valores a excluir de los gráficos (celdas vacías, desconocidos)
  exclude_values: ["Unknown", "unclear", ""]

  # Grupos vulnerables a destacar en el análisis
  vulnerable_groups:
    - "Minors"
    - "Women"
    - "Women, Minority Groups"
    - "Black People"
    - "Patients"

  # Cuántos items mostrar en los rankings
  top_n_principles: 6
  top_n_industries: 10
  top_n_harmed:     10

  # Ventanas para la media móvil (en meses)
  moving_average_windows: [3, 6, 12]

  # Tipos de daño que se grafican en la cronología
  harm_chronology_types:
    - "Lack of capability or robustness"
    - "Unfair discrimination and misrepresentation"

  # Agrupaciones opcionales de tipos de daño
  harm_aggregations:
    Health: ["Physical", "Psychological"]

  # Escala de severidad para el índice de daño
  harm_level_severity:
    "none":                        0
    "AI tangible harm near-miss":  1
    "AI tangible harm issue":      2
    "AI tangible harm event":      3



# ─────────────────────────────────────────────────────────────────────────────
# REPORTE — Título y salidas
# ─────────────────────────────────────────────────────────────────────────────

reporting:
  report_title:       "Análisis de Incidentes de IA"
  data_source_label:  "AI Incident Database (OECD)"
  reports_dir:        "outputs/reports"   # Dónde guardar el HTML y el JSON de métricas

  html_report:
    filter_columns:       []       # Vacío = todas las columnas disponibles
    range_filter_columns: ["year"] # Columnas numéricas con slider de rango

random_state: 42
