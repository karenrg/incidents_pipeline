# =============================================================================
# Configuración del pipeline de análisis de incidentes de IA
# =============================================================================
# Solo necesitás editar la sección "REQUERIDO" para empezar.
# Todo lo demás tiene valores por defecto que funcionan sin cambios.
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
# REQUERIDO — Las únicas cosas que tenés que configurar
# ─────────────────────────────────────────────────────────────────────────────

data:
  # Ruta al archivo CSV con los incidentes de IA
  source_path: "data/raw/oecd_aim.csv"

  # Mapeo de columnas: qué columna de tu CSV cumple cada rol en el análisis.
  # - Lado izquierdo: rol interno del pipeline (no cambiar)
  # - Lado derecho: nombre exacto de la columna en tu CSV
  column_mapping:
    text_data:   "summary"             # Texto principal del incidente (requerido)
    event_date:  "date"                # Fecha del incidente
    geo_zone:    "region"             # Región geográfica
    tags_list:   "principles"         # Principios OCDE de IA
    harmtype:    "harmtype"           # Tipo de daño
    industries:  "industries"         # Sector de despliegue
    harmed:      "harmed"             # Grupos afectados
    harmlevel:   "harmlevel"          # Nivel de gravedad

  # Columnas que contienen listas de valores (ej: '["sector1", "sector2"]').
  multilabel_columns:
    - "principles"
    - "industries"
    - "harmed"
    - "harmtype"

  # Dónde guardar el dataset procesado (se crea automáticamente)
  processed_path: "data/processed/oecd_aim_processed.parquet"


# ─────────────────────────────────────────────────────────────────────────────
# OPCIONAL — Podés dejar estos valores como están o ajustarlos
# ─────────────────────────────────────────────────────────────────────────────

filters:
  # Rango de años a incluir. Replicamos el scope del paper y la tesis.
  year_range: [2014, 2023]
  # Regiones a incluir (vacío [] = todas).
  regions:
    - "North America"
    - "Europe"
    - "Asia"


# ─────────────────────────────────────────────────────────────────────────────
# ANÁLISIS DE SENTIMIENTO — Desactivado por defecto
# ─────────────────────────────────────────────────────────────────────────────

sentiment:
  enabled: false

  backend: "transformer"

  openai_model:   "gpt-4o-mini"
  openai_api_key: ""

  model_name:  "cardiffnlp/twitter-roberta-base-sentiment-latest"
  batch_size:  32

  thresholds:
    high:   0.7
    medium: 0.4

  evaluation:
    enabled: false
    human_label_column: "human_label"


# ─────────────────────────────────────────────────────────────────────────────
# NLP — Procesamiento de texto
# ─────────────────────────────────────────────────────────────────────────────

nlp:
  language: "english"
  min_token_length: 3

  custom_stopwords:
    - "ai"
    - "u"
    - "system"
    - "report"
    - "new"
    - "say"
    - "use"
    - "would"
    - "also"
    - "one"
    - "year"
    - "could"
    - "make"
    - "said"
    - "according"

  normalization_map:
    deepfakes: "deepfake"
    chatbots:  "chatbot"
    warns:     "warn"
    using:     "use"
    used:      "use"
    worker:    "worker"
    workers:   "worker"

  mental_health_keywords:
    - "mental health"
    - "stress"
    - "anxiety"
    - "depression"
    - "psychological"
    - "suicide"
    - "self-harm"


# ─────────────────────────────────────────────────────────────────────────────
# ANÁLISIS DESCRIPTIVO — Parámetros de las métricas
# ─────────────────────────────────────────────────────────────────────────────

analysis:
  columns:
    region:             "geo_zone"
    year:               "year"
    year_month:         "year_month"
    tags:               "tags_list"
    harm_type:          "harmtype"
    industries:         "industries"
    harmed:             "harmed"
    harm_level:         "harmlevel"
    sentiment_score:    "sentiment_score"
    mental_health_flag: "mental_health_flag"
    tokens:             "tokens"

  exclude_values: ["Unknown", "unclear", ""]

  vulnerable_groups:
    - "Children"
    - "Women"
    - "Minorities"
    - "Workers"

  top_n_principles: 7
  top_n_industries: 10
  top_n_harmed:     10

  moving_average_windows: [3, 6, 12]

  # Tipos de daño con tendencia creciente (Figura 11 del paper)
  harm_chronology_types:
    - "Psychological"
    - "Physical"
    - "Human rights"

  harm_aggregations: {}

  harm_level_severity:
    "none":                       0
    "unclear":                    0
    "AI tangible harm issue":     1
    "AI tangible harm near-miss": 2
    "AI tangible harm event":     3


# ─────────────────────────────────────────────────────────────────────────────
# REPORTE — Título y salidas
# ─────────────────────────────────────────────────────────────────────────────

reporting:
  report_title:       "Análisis de Incidentes de IA — OECD AIM"
  data_source_label:  "OECD AI Incidents Monitor (AIM)"
  reports_dir:        "outputs/reports"

  html_report:
    filter_columns:       []
    range_filter_columns: ["year"]

random_state: 42
